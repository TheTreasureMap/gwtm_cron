[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwtm_cron"
version = "0.1.0"
authors = [
  { name="Samuel Wyatt", email="swyatt@arizona.edu" },
  { name="Steve Foale", email="sfoale@lco.global" },
]
description = "Kafka-based listener system for LIGO/Virgo/KAGRA gravitational wave alerts and IceCube neutrino coincidence notices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["gravitational-waves", "astronomy", "kafka", "ligo", "icecube", "alerts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
"Homepage" = "https://github.com/TheTreasureMap/gwtm_cron"
"Repository" = "https://github.com/TheTreasureMap/gwtm_cron"
"Bug Tracker" = "https://github.com/TheTreasureMap/gwtm_cron/issues"
"Documentation" = "https://github.com/TheTreasureMap/gwtm_cron/blob/master/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gwtm_cron"]
